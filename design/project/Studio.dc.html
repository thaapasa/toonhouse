<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toonhouse Studio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#ECEDF0}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: #141519; font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #ECEDF0; display: flex; flex-direction: column; font-size: 13px">

  <header style="height: 48px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 16px; background: #1C1D22; border-bottom: 1px solid #2A2C34">
    <div style="display: flex; align-items: center; gap: 8px">
      <svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true"><path d="M12 30 L32 13 L52 30 V51 H12 Z" fill="none" stroke="#F2B544" stroke-width="5" stroke-linejoin="round"></path><path d="M27 28.5 L40 36 L27 43.5 Z" fill="#F2B544" stroke="#F2B544" stroke-width="2" stroke-linejoin="round"></path></svg>
      <span style="font-weight: 700; font-size: 15px">Studio</span>
      <span style="padding: 2px 6px; border-radius: 4px; background: #2A2C34; color: #9EA1AC; font-size: 11px; font-weight: 600">dev</span>
    </div>
    <div style="width: 1px; height: 20px; background: #2F313A"></div>
    <div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #9EA1AC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">assets/packs/adventure/characters/captain/<span style="color: #ECEDF0">rig.json</span></div>
    <span style="width: 7px; height: 7px; border-radius: 50%; background: #F2B544; flex: none" title="Unsaved changes"></span>
    <div style="flex: 1"></div>
    <button style="height: 32px; border: 0; border-radius: 7px; background: transparent; color: #C9CBD3; font: inherit; font-weight: 500; padding: 0 12px; cursor: pointer">Revert</button>
    <button style="height: 32px; border: 0; border-radius: 7px; background: #F2B544; color: #15161A; font: inherit; font-weight: 600; padding: 0 14px; cursor: pointer; display: flex; align-items: center; gap: 6px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M8 4v5h7V4"></path><path d="M8 20v-6h8v6"></path></svg>
      Save
    </button>
  </header>

  <div style="flex: 1; min-height: 0; display: flex; flex-wrap: wrap">

    <aside aria-label="Assets" style="width: 220px; flex: 1 1 220px; max-width: 220px; box-sizing: border-box; background: #1C1D22; border-right: 1px solid #2A2C34; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; min-width: 200px">
      <div style="padding: 8px 8px 4px; color: #8D909B; font-size: 11px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase">Characters</div>
      <sc-for list="{{ characters }}" as="c" hint-placeholder-count="8">
        <button onClick="{{ c.pick }}" style="height: 32px; border: 0; border-radius: 7px; background: {{ c.bg }}; color: {{ c.fg }}; display: flex; align-items: center; gap: 10px; padding: 0 8px; font: inherit; font-weight: 500; font-size: 13px; cursor: pointer; text-align: left">
          <span style="width: 24px; height: 24px; flex: none; border-radius: 6px; background: #2E3038; overflow: hidden; display: flex; align-items: flex-start; justify-content: center"><img src="{{ c.src }}" alt="" style="width: 30px; margin-top: -1px"></span>
          <span style="flex: 1">{{ c.name }}</span>
          <span style="color: #6B6E79; font-size: 11px">{{ c.rig }}</span>
        </button>
      </sc-for>
      <div style="padding: 12px 8px 4px; color: #8D909B; font-size: 11px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase">Props</div>
      <sc-for list="{{ props }}" as="c" hint-placeholder-count="5">
        <button style="height: 32px; border: 0; border-radius: 7px; background: transparent; color: #C9CBD3; display: flex; align-items: center; gap: 10px; padding: 0 8px; font: inherit; font-weight: 500; font-size: 13px; cursor: pointer; text-align: left">
          <span style="width: 24px; height: 24px; flex: none; border-radius: 6px; background: #2E3038; overflow: hidden; display: flex; align-items: center; justify-content: center"><img src="{{ c.src }}" alt="" style="max-width: 20px; max-height: 20px"></span>
          <span style="flex: 1">{{ c.name }}</span>
        </button>
      </sc-for>
      <div style="padding: 12px 8px 4px; color: #8D909B; font-size: 11px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase">Backgrounds</div>
      <sc-for list="{{ backgrounds }}" as="c" hint-placeholder-count="4">
        <button style="height: 32px; border: 0; border-radius: 7px; background: transparent; color: #C9CBD3; display: flex; align-items: center; gap: 10px; padding: 0 8px; font: inherit; font-weight: 500; font-size: 13px; cursor: pointer; text-align: left">
          <span style="width: 24px; height: 24px; flex: none; border-radius: 6px; overflow: hidden; display: block"><img src="{{ c.src }}" alt="" style="width: 24px; height: 24px; object-fit: cover; display: block"></span>
          <span style="flex: 1">{{ c.name }}</span>
        </button>
      </sc-for>
    </aside>

    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">

      <div style="flex: 1; min-height: 520px; position: relative; background-color: #191A1F; background-image: radial-gradient(circle, #2C2E36 1px, transparent 1.2px); background-size: 20px 20px; overflow: hidden">
        <div role="toolbar" aria-label="Viewport" style="position: absolute; left: 12px; top: 12px; display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: #1C1D22; box-shadow: 0 0 0 1px #2A2C34; z-index: 2">
          <button onClick="{{ toggleBones }}" aria-pressed="{{ bones }}" title="Show bones and pivots" style="height: 30px; border: 0; border-radius: 6px; background: {{ bonesBg }}; color: #ECEDF0; font: inherit; font-weight: 500; font-size: 12px; padding: 0 10px; cursor: pointer; display: flex; align-items: center; gap: 6px">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"></circle><circle cx="18" cy="18" r="2.5"></circle><path d="M8 8l8 8"></path></svg>
            Bones
          </button>
          <button onClick="{{ toggleOnion }}" aria-pressed="{{ onion }}" title="Onion skin: show the previous and next keyframe" style="height: 30px; border: 0; border-radius: 6px; background: {{ onionBg }}; color: #ECEDF0; font: inherit; font-weight: 500; font-size: 12px; padding: 0 10px; cursor: pointer; display: flex; align-items: center; gap: 6px">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="9" cy="12" r="6"></circle><circle cx="15" cy="12" r="6" stroke-dasharray="2 2.5"></circle></svg>
            Onion skin
          </button>
          <button title="Ground line" style="height: 30px; border: 0; border-radius: 6px; background: #2E3038; color: #ECEDF0; font: inherit; font-weight: 500; font-size: 12px; padding: 0 10px; cursor: pointer">Ground</button>
        </div>
        <div style="position: absolute; right: 12px; top: 12px; display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 9px; background: #1C1D22; box-shadow: 0 0 0 1px #2A2C34; z-index: 2">
          <button aria-label="Zoom out" title="Zoom out" style="width: 30px; height: 30px; border: 0; border-radius: 6px; background: transparent; color: #ECEDF0; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
          <span style="width: 44px; text-align: center; font-size: 12px; font-variant-numeric: tabular-nums">100%</span>
          <button aria-label="Zoom in" title="Zoom in" style="width: 30px; height: 30px; border: 0; border-radius: 6px; background: transparent; color: #ECEDF0; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
        </div>

        <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 64px; border-top: 1px dashed #3A3D46"></div>

        <div style="position: absolute; left: 50%; bottom: 64px; width: 143px; height: 480px; margin-left: -71px">
          <sc-if value="{{ onion }}" hint-placeholder-val="{{ true }}">
            <img src="img/captain.png" alt="" style="position: absolute; left: -26px; top: 0; height: 480px; opacity: 0.14; filter: grayscale(1)">
            <img src="img/captain.png" alt="" style="position: absolute; left: 26px; top: 0; height: 480px; opacity: 0.14; filter: grayscale(1)">
          </sc-if>
          <img src="img/captain.png" alt="Captain" style="position: absolute; left: 0; top: 0; height: 480px">
        </div>

        <div style="position: absolute; left: 12px; bottom: 12px; display: flex; align-items: center; gap: 8px; color: #8D909B; font-size: 12px">
          <span>Clip works on</span>
          <div style="display: flex; gap: 4px">
            <sc-for list="{{ compatible }}" as="c" hint-placeholder-count="4">
              <span title="{{ c.name }}" style="width: 28px; height: 28px; border-radius: 7px; background: #24262D; overflow: hidden; display: flex; justify-content: center"><img src="{{ c.src }}" alt="{{ c.name }}" style="width: 24px"></span>
            </sc-for>
          </div>
          <button style="height: 28px; border: 0; border-radius: 7px; background: #24262D; color: #ECEDF0; font: inherit; font-weight: 500; font-size: 12px; padding: 0 10px; cursor: pointer">Play on all</button>
        </div>
      </div>

      <section aria-label="Clips" style="flex: none; background: #1C1D22; border-top: 1px solid #2A2C34">
        <div style="display: flex; align-items: center; gap: 4px; padding: 8px 12px 0; flex-wrap: wrap">
          <sc-for list="{{ clips }}" as="clip" hint-placeholder-count="7">
            <button onClick="{{ clip.pick }}" aria-pressed="{{ clip.on }}" style="height: 30px; border: 0; border-radius: 7px; background: {{ clip.bg }}; color: {{ clip.fg }}; font: inherit; font-weight: 500; font-size: 13px; padding: 0 12px; cursor: pointer; display: flex; align-items: center; gap: 6px">
              {{ clip.name }}<span style="color: {{ clip.sub }}; font-size: 11px">{{ clip.len }}</span>
            </button>
          </sc-for>
          <button aria-label="New clip" title="New clip" style="width: 30px; height: 30px; border: 0; border-radius: 7px; background: transparent; color: #9EA1AC; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
        </div>

        <div style="display: flex; align-items: center; gap: 2px; padding: 6px 8px 2px">
          <button aria-label="Previous keyframe" title="Previous keyframe" style="width: 34px; height: 34px; border: 0; border-radius: 7px; background: transparent; color: #ECEDF0; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v14"></path><path d="M19 5l-10 7 10 7z"></path></svg></button>
          <button onClick="{{ togglePlay }}" aria-label="{{ playLabel }}" title="{{ playLabel }}" style="width: 34px; height: 34px; border: 0; border-radius: 7px; background: #2E3038; color: #ECEDF0; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center">
            <sc-if value="{{ playing }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"></rect><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"></rect></svg></sc-if>
            <sc-if value="{{ paused }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"></path></svg></sc-if>
          </button>
          <button aria-label="Next keyframe" title="Next keyframe" style="width: 34px; height: 34px; border: 0; border-radius: 7px; background: transparent; color: #ECEDF0; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 5v14"></path><path d="M5 5l10 7-10 7z"></path></svg></button>
          <button aria-pressed="true" aria-label="Loop" title="Loop" style="width: 34px; height: 34px; border: 0; border-radius: 7px; background: transparent; color: #F2B544; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l3 3-3 3"></path><path d="M4 11V9a4 4 0 0 1 4-4h12"></path><path d="M7 22l-3-3 3-3"></path><path d="M20 13v2a4 4 0 0 1-4 4H4"></path></svg></button>
          <div style="margin-left: 8px; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap"><span style="font-weight: 600">Frame 39</span><span style="color: #9EA1AC"> / 77 · 30 fps</span></div>
          <div style="flex: 1"></div>
          <div role="group" aria-label="Speed" style="display: flex; padding: 2px; border-radius: 7px; background: #26282F">
            <sc-for list="{{ speeds }}" as="sp" hint-placeholder-count="4">
              <button onClick="{{ sp.pick }}" aria-pressed="{{ sp.on }}" style="height: 26px; border: 0; border-radius: 5px; background: {{ sp.bg }}; color: {{ sp.fg }}; font: inherit; font-weight: 500; font-size: 12px; padding: 0 8px; cursor: pointer">{{ sp.label }}</button>
            </sc-for>
          </div>
          <button style="height: 30px; border: 0; border-radius: 7px; background: #2E3038; color: #ECEDF0; font: inherit; font-weight: 500; font-size: 12px; padding: 0 10px; margin-left: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l7 8-7 8-7-8z"></path></svg>
            Add keyframe
          </button>
        </div>

        <div style="position: relative; padding: 0 12px 10px 0">
          <div style="display: flex; height: 20px">
            <div style="width: 132px; flex: none"></div>
            <div style="flex: 1; position: relative; font-size: 10px; color: #8D909B; font-variant-numeric: tabular-nums">
              <sc-for list="{{ frames }}" as="f" hint-placeholder-count="7">
                <span style="position: absolute; left: {{ f.left }}; top: 0; height: 20px; border-left: 1px solid #34363F; padding-left: 3px; line-height: 14px">{{ f.label }}</span>
              </sc-for>
            </div>
          </div>
          <sc-for list="{{ boneRows }}" as="b" hint-placeholder-count="7">
            <div style="display: flex; height: 22px; align-items: center; background: {{ b.rowBg }}">
              <div style="width: 132px; flex: none; box-sizing: border-box; padding-left: 14px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: {{ b.fg }}">{{ b.name }}</div>
              <div style="flex: 1; height: 22px; position: relative; border-bottom: 1px solid #24262D">
                <sc-for list="{{ b.keys }}" as="k" hint-placeholder-count="3">
                  <span style="position: absolute; left: {{ k.left }}; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; transform: rotate(45deg); background: {{ b.key }}; border-radius: 1px"></span>
                </sc-for>
              </div>
            </div>
          </sc-for>
          <div aria-hidden="true" style="position: absolute; top: 0; bottom: 10px; left: calc(132px + 0.513 * (100% - 144px)); width: 0">
            <div style="position: absolute; left: -1px; top: 0; bottom: 0; width: 2px; background: #F2B544"></div>
            <div style="position: absolute; left: -6px; top: 0; width: 12px; height: 12px; background: #F2B544; border-radius: 2px 2px 6px 6px"></div>
          </div>
        </div>
      </section>
    </main>

    <aside aria-label="Inspector" style="width: 300px; flex: 1 1 300px; max-width: 300px; min-width: 260px; box-sizing: border-box; background: #1C1D22; border-left: 1px solid #2A2C34; display: flex; flex-direction: column">
      <div role="tablist" style="display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid #2A2C34">
        <button role="tab" onClick="{{ tabLook }}" aria-selected="{{ isLook }}" style="height: 36px; border: 0; background: transparent; color: {{ lookFg }}; box-shadow: inset 0 -2px 0 {{ lookLine }}; font: inherit; font-weight: 600; font-size: 13px; padding: 0 12px; cursor: pointer">Appearance</button>
        <button role="tab" onClick="{{ tabRig }}" aria-selected="{{ isRig }}" style="height: 36px; border: 0; background: transparent; color: {{ rigFg }}; box-shadow: inset 0 -2px 0 {{ rigLine }}; font: inherit; font-weight: 600; font-size: 13px; padding: 0 12px; cursor: pointer">Rig</button>
      </div>

      <sc-if value="{{ isLook }}" hint-placeholder-val="{{ true }}">
        <div style="padding: 14px 14px 18px; display: flex; flex-direction: column; gap: 18px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <div style="color: #8D909B; font-size: 11px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase">Colors</div>
            <sc-for list="{{ slots }}" as="s" hint-placeholder-count="6">
              <button onClick="{{ s.pick }}" aria-pressed="{{ s.on }}" style="height: 34px; border: 0; border-radius: 7px; background: {{ s.bg }}; box-shadow: inset 0 0 0 1px {{ s.ring }}; color: #ECEDF0; display: flex; align-items: center; gap: 10px; padding: 0 8px; font: inherit; font-size: 13px; cursor: pointer; text-align: left">
                <span style="width: 20px; height: 20px; flex: none; border-radius: 5px; background: {{ s.color }}; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18)"></span>
                <span style="flex: 1">{{ s.name }}</span>
                <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #9EA1AC">{{ s.color }}</span>
              </button>
            </sc-for>
            <div style="margin-top: 4px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
              <sc-for list="{{ palette }}" as="p" hint-placeholder-count="14">
                <button onClick="{{ p.pick }}" aria-label="{{ p.hex }}" title="{{ p.hex }}" style="aspect-ratio: 1; border: 0; border-radius: 6px; background: {{ p.hex }}; box-shadow: {{ p.ring }}; cursor: pointer; padding: 0"></button>
              </sc-for>
            </div>
            <div style="color: #8D909B; font-size: 11px">Shared palette · choose a slot, then a color</div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 8px">
            <div style="color: #8D909B; font-size: 11px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase">Variants</div>
            <div style="display: flex; align-items: center; gap: 10px">
              <label for="hair" style="width: 80px; color: #C9CBD3">Hair</label>
              <select id="hair" style="flex: 1; height: 32px; border: 0; border-radius: 7px; background: #26282F; color: #ECEDF0; font: inherit; font-size: 13px; padding: 0 8px">
                <option>Curly</option><option>Bun</option><option>Short</option>
              </select>
            </div>
            <div style="display: flex; align-items: center; gap: 10px">
              <label for="outfit" style="width: 80px; color: #C9CBD3">Top</label>
              <select id="outfit" style="flex: 1; height: 32px; border: 0; border-radius: 7px; background: #26282F; color: #ECEDF0; font: inherit; font-size: 13px; padding: 0 8px">
                <option>Coat</option><option>Shirt</option><option>Vest</option>
              </select>
            </div>
            <div style="display: flex; align-items: center; gap: 10px">
              <span style="width: 80px; color: #C9CBD3">Earring</span>
              <button role="switch" onClick="{{ toggleGlasses }}" aria-checked="{{ glasses }}" aria-label="Earring" style="width: 36px; height: 20px; border: 0; border-radius: 10px; background: {{ glassesBg }}; position: relative; cursor: pointer; padding: 0">
                <span style="position: absolute; top: 2px; left: {{ glassesKnob }}; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF"></span>
              </button>
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 10px">
            <div style="color: #8D909B; font-size: 11px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase">Proportions</div>
            <div style="display: flex; align-items: center; gap: 10px">
              <label for="height" style="width: 80px; color: #C9CBD3">Height</label>
              <input id="height" type="range" min="70" max="130" value="100" style="flex: 1; accent-color: #F2B544">
              <span style="width: 36px; text-align: right; font-variant-numeric: tabular-nums; color: #9EA1AC; font-size: 12px">100%</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px">
              <label for="head" style="width: 80px; color: #C9CBD3">Head size</label>
              <input id="head" type="range" min="70" max="130" value="108" style="flex: 1; accent-color: #F2B544">
              <span style="width: 36px; text-align: right; font-variant-numeric: tabular-nums; color: #9EA1AC; font-size: 12px">108%</span>
            </div>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ isRig }}" hint-placeholder-val="{{ false }}">
        <div style="padding: 14px 14px 18px; display: flex; flex-direction: column; gap: 18px">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <div style="color: #8D909B; font-size: 11px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase">Selected bone</div>
            <div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px">arm_r.upper</div>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
              <label style="display: flex; flex-direction: column; gap: 4px; color: #9EA1AC; font-size: 11px">Pivot X<input value="140" style="height: 30px; border: 0; border-radius: 7px; background: #26282F; color: #ECEDF0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; padding: 0 8px"></label>
              <label style="display: flex; flex-direction: column; gap: 4px; color: #9EA1AC; font-size: 11px">Pivot Y<input value="160" style="height: 30px; border: 0; border-radius: 7px; background: #26282F; color: #ECEDF0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; padding: 0 8px"></label>
              <label style="display: flex; flex-direction: column; gap: 4px; color: #9EA1AC; font-size: 11px">Rotation<input value="34°" style="height: 30px; border: 0; border-radius: 7px; background: #26282F; color: #ECEDF0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; padding: 0 8px"></label>
              <label style="display: flex; flex-direction: column; gap: 4px; color: #9EA1AC; font-size: 11px">Draw order<input value="7" style="height: 30px; border: 0; border-radius: 7px; background: #26282F; color: #ECEDF0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; padding: 0 8px"></label>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <div style="color: #8D909B; font-size: 11px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; margin-bottom: 6px">Bones</div>
            <sc-for list="{{ tree }}" as="t" hint-placeholder-count="10">
              <div style="height: 26px; display: flex; align-items: center; padding-left: {{ t.indent }}; border-radius: 6px; background: {{ t.bg }}; color: {{ t.fg }}; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px">{{ t.name }}</div>
            </sc-for>
          </div>
        </div>
      </sc-if>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      char: 'captain', clip: 'walk', speed: '1×', playing: true, bones: false, onion: false, tab: 'look', slot: 3, glasses: true,
      colors: ['#C98B5E', '#5A3418', '#B3261E', '#0F2E45', '#A7801C', '#6A2A2A', '#2A1E1E'],
    };
  }
  renderVals() {
    const s = this.state;
    const chars = [['captain', 'Captain', 'adventure'], ['quartermaster', 'Quartermaster', 'adventure'], ['boy', 'Boy', 'sunny'], ['bunny', 'Bunny', 'sunny'],
      ['duck', 'Duck', 'sunny'], ['emo-girl', 'Emo girl', 'sunny'], ['grandma', 'Grandma', 'sunny'], ['hen', 'Hen', 'sunny'],
      ['raincoat-girl', 'Raincoat girl', 'sunny'], ['squirrel', 'Squirrel', 'sunny'], ['wizard', 'Wizard', 'sunny']];
    const characters = chars.map(([id, name, rig]) => ({
      name, rig, src: 'img/' + id + '.png', bg: s.char === id ? '#2E3038' : 'transparent', fg: s.char === id ? '#FFFFFF' : '#C9CBD3',
      pick: () => this.setState({ char: id }),
    }));
    const props = [['Apple tree', 'apple-tree'], ['Flowering bush', 'flowering-bush'], ['Hedge', 'hedge'], ['Oak', 'oak'], ['Round bush', 'round-bush'], ['Spruce', 'spruce']]
      .map(([name, id]) => ({ name, src: 'img/' + id + '.png' }));
    const backgrounds = [['Harbor', 'harbor'], ['Farm', 'farm'], ['Meadow', 'meadow'], ['Village', 'village']]
      .map(([name, id]) => ({ name, src: 'img/' + id + '.jpg' }));
    const compatible = ['captain', 'quartermaster', 'boy', 'emo-girl', 'grandma', 'raincoat-girl', 'wizard'].map((id) => ({ name: id, src: 'img/' + id + '.png' }));
    const clipList = [['idle', 'Idle', '120f'], ['walk', 'Walk', '77f'], ['wave', 'Wave', '96f'], ['talk', 'Talk', '90f']];
    const clips = clipList.map(([id, name, len]) => ({
      name, len, on: s.clip === id, bg: s.clip === id ? '#F2B544' : '#26282F', fg: s.clip === id ? '#15161A' : '#ECEDF0',
      sub: s.clip === id ? '#5A4A20' : '#8D909B', pick: () => this.setState({ clip: id }),
    }));
    const speeds = ['0.25×', '0.5×', '1×', '2×'].map((label) => ({
      label, on: s.speed === label, bg: s.speed === label ? '#3A3D46' : 'transparent', fg: s.speed === label ? '#ECEDF0' : '#9EA1AC',
      pick: () => this.setState({ speed: label }),
    }));
    const frames = [0, 10, 20, 30, 40, 50, 60, 70].map((f) => ({ left: (f / 76 * 100).toFixed(2) + '%', label: String(f) }));
    const pos = (fs) => fs.map((f) => ({ left: (f / 76 * 100).toFixed(2) + '%' }));
    const boneRows = [
      ['root', [0, 38, 76]], ['torso', [0, 19, 38, 57, 76]], ['head', [0, 38, 76]], ['arm_l.upper', [0, 19, 38, 57, 76]],
      ['arm_r.upper', [0, 19, 38, 57, 76]], ['leg_l.upper', [0, 10, 19, 38, 48, 57, 76]], ['leg_r.upper', [0, 10, 19, 29, 38, 57, 76]],
    ].map(([name, keys]) => ({
      name, keys: pos(keys), rowBg: name === 'arm_r.upper' ? '#26282F' : 'transparent',
      fg: name === 'arm_r.upper' ? '#F2B544' : '#C9CBD3', key: name === 'arm_r.upper' ? '#F2B544' : '#9EA1AC',
    }));
    const slotNames = ['Skin', 'Hair', 'Bandana', 'Jacket', 'Trousers', 'Boots', 'Outline'];
    const slots = slotNames.map((name, i) => ({
      name, color: s.colors[i], on: s.slot === i, bg: s.slot === i ? '#26282F' : 'transparent', ring: s.slot === i ? '#F2B544' : 'transparent',
      pick: () => this.setState({ slot: i }),
    }));
    const pal = ['#B3261E', '#C9672A', '#D9A441', '#A7801C', '#5E7D3A', '#1E6B4A', '#2F5E8A', '#0F2E45', '#5B3F7A', '#C98B5E', '#8B5A2B', '#5A3418', '#6A2A2A', '#2A1E1E'];
    const cur = s.colors[s.slot];
    const palette = pal.map((hex) => ({
      hex, ring: hex === cur ? '0 0 0 2px #1C1D22, 0 0 0 4px #ECEDF0' : 'inset 0 0 0 1px rgba(255,255,255,0.12)',
      pick: () => { const c = s.colors.slice(); c[s.slot] = hex; this.setState({ colors: c }); },
    }));
    const tree = [['root', 0], ['torso', 1], ['head', 2], ['arm_l.upper', 2], ['arm_l.lower', 3], ['arm_r.upper', 2], ['arm_r.lower', 3], ['hips', 1], ['leg_l.upper', 2], ['leg_r.upper', 2]]
      .map(([name, d]) => ({ name, indent: 8 + d * 14 + 'px', bg: name === 'arm_r.upper' ? '#2E3038' : 'transparent', fg: name === 'arm_r.upper' ? '#F2B544' : '#C9CBD3' }));
    const isLook = s.tab === 'look';
    return {
      characters, props, backgrounds, compatible, clips, speeds, frames, boneRows, slots, palette, tree,
      playing: s.playing, paused: !s.playing, playLabel: s.playing ? 'Pause' : 'Play', togglePlay: () => this.setState({ playing: !s.playing }),
      bones: s.bones, bonesBg: s.bones ? '#2E3038' : 'transparent', toggleBones: () => this.setState({ bones: !s.bones }),
      onion: s.onion, onionBg: s.onion ? '#2E3038' : 'transparent', toggleOnion: () => this.setState({ onion: !s.onion }),
      isLook, isRig: !isLook, tabLook: () => this.setState({ tab: 'look' }), tabRig: () => this.setState({ tab: 'rig' }),
      lookFg: isLook ? '#ECEDF0' : '#9EA1AC', lookLine: isLook ? '#F2B544' : 'transparent',
      rigFg: !isLook ? '#ECEDF0' : '#9EA1AC', rigLine: !isLook ? '#F2B544' : 'transparent',
      glasses: s.glasses, glassesBg: s.glasses ? '#F2B544' : '#3A3D46', glassesKnob: s.glasses ? '18px' : '2px',
      toggleGlasses: () => this.setState({ glasses: !s.glasses }),
    };
  }
}
</script>
