<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Toonhouse — piirretyt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#ECEDF0}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1194px; height: 834px; box-sizing: border-box; background: #141519; font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #ECEDF0; display: flex; flex-direction: column; overflow: hidden; font-size: 13px">

  <header style="height: 56px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 24px; background: #1C1D22; border-bottom: 1px solid #2A2C34">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><path d="M12 30 L32 13 L52 30 V51 H12 Z" fill="none" stroke="#F2B544" stroke-width="5" stroke-linejoin="round"></path><path d="M27 28.5 L40 36 L27 43.5 Z" fill="#F2B544" stroke="#F2B544" stroke-width="2" stroke-linejoin="round"></path></svg>
      <div style="font-weight: 700; font-size: 17px; letter-spacing: -0.2px">Toonhouse</div>
    </div>
    <div style="flex: 1"></div>
    <div role="group" aria-label="Kieli" style="display: flex; padding: 2px; border-radius: 8px; background: #26282F">
      <button aria-pressed="true" style="width: 40px; height: 32px; border: 0; border-radius: 6px; background: #3A3D46; color: #ECEDF0; font: inherit; font-weight: 600; font-size: 12px; cursor: pointer">FI</button>
      <button aria-pressed="false" style="width: 40px; height: 32px; border: 0; border-radius: 6px; background: transparent; color: #9EA1AC; font: inherit; font-weight: 600; font-size: 12px; cursor: pointer">EN</button>
    </div>
    <a href="Editor.dc.html" style="height: 36px; box-sizing: border-box; border-radius: 8px; background: #F2B544; display: flex; align-items: center; gap: 6px; padding: 0 14px 0 10px; color: #15161A; text-decoration: none; font-weight: 600; font-size: 13px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Uusi piirretty
    </a>
  </header>

  <main style="flex: 1; min-height: 0; box-sizing: border-box; padding: 28px 32px 32px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; align-items: baseline; gap: 10px">
      <h1 style="margin: 0; font-weight: 600; font-size: 22px; letter-spacing: -0.3px">Piirretyt</h1>
      <span style="color: #9EA1AC; font-size: 13px">5</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 24px">
      <sc-for list="{{ toons }}" as="toon" hint-placeholder-count="5">
        <article style="display: flex; flex-direction: column; gap: 10px">
          <a href="Editor.dc.html" aria-label="Muokkaa: {{ toon.title }}" style="display: block; aspect-ratio: 16 / 9; position: relative; border-radius: 10px; overflow: hidden; background: #24262D; box-shadow: 0 0 0 1px #2A2C34">
            <img src="{{ toon.bg }}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block">
            <sc-for list="{{ toon.sprites }}" as="s" hint-placeholder-count="3">
              <img src="{{ s.src }}" alt="" style="{{ s.style }}">
            </sc-for>
            <span style="position: absolute; right: 8px; bottom: 8px; padding: 3px 7px; border-radius: 5px; background: rgba(20,21,25,0.78); color: #ECEDF0; font-weight: 500; font-size: 11px; font-variant-numeric: tabular-nums">{{ toon.dur }}</span>
          </a>
          <div style="display: flex; align-items: center; gap: 4px">
            <div style="flex: 1; min-width: 0">
              <div style="font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ toon.title }}</div>
              <div style="margin-top: 2px; color: #9EA1AC; font-size: 12px">{{ toon.edited }}</div>
            </div>
            <a href="Player.dc.html" aria-label="Katso" title="Katso" style="width: 40px; height: 40px; flex: none; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #ECEDF0">
              <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"></path></svg>
            </a>
            <button aria-label="Lisää" title="Lisää" style="width: 40px; height: 40px; flex: none; border: 0; border-radius: 8px; background: transparent; display: flex; align-items: center; justify-content: center; color: #9EA1AC; cursor: pointer; padding: 0">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
            </button>
          </div>
        </article>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    const sp = (k, pos, h, flip) => ({ src: 'img/' + k + '.png', style: 'position: absolute; ' + pos + '; height: ' + h + (flip ? '; transform: scaleX(-1)' : '') });
    const bg = (k) => 'img/' + k + '.jpg';
    const toons = [
      { title: 'Sadepäivä', dur: '0:12', edited: 'Muokattu tänään', bg: bg('harbor'),
        sprites: [sp('raincoat-girl', 'left: 30%; bottom: 8%', '48%')] },
      { title: 'Metsäretki', dur: '0:29', edited: 'Muokattu tänään', bg: bg('meadow'),
        sprites: [sp('spruce', 'left: 66%; bottom: 12%', '75%'), sp('boy', 'left: 26%; bottom: 8%', '40%'), sp('emo-girl', 'left: 42%; bottom: 8%', '41%', true), sp('bunny', 'left: 84%; bottom: 7%', '19%', true)] },
      { title: 'Kapteenin kartta', dur: '0:41', edited: 'Muokattu eilen', bg: bg('harbor'),
        sprites: [sp('captain', 'left: 36%; bottom: 8%', '46%'), sp('quartermaster', 'left: 52%; bottom: 8%', '50%')] },
      { title: 'Mummon kanat', dur: '0:18', edited: 'Muokattu 19.11.', bg: bg('farm'),
        sprites: [sp('grandma', 'left: 24%; bottom: 8%', '42%'), sp('hen', 'left: 48%; bottom: 8%', '17%', true), sp('duck', 'left: 64%; bottom: 8%', '15%', true)] },
      { title: 'Velho kylässä', dur: '0:33', edited: 'Muokattu 12.11.', bg: bg('village'),
        sprites: [sp('wizard', 'left: 30%; bottom: 8%', '48%'), sp('squirrel', 'left: 56%; bottom: 8%', '15%', true)] },
    ];
    return { toons };
  }
}
</script>
</body>
</html>
