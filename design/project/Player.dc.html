<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Toonhouse — katso</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Indie+Flower&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1194px; height: 834px; box-sizing: border-box; background: #1B1D24; font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #ECEDF0; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 81px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 0 24px">
    <a href="Editor.dc.html" style="height: 52px; box-sizing: border-box; border: 3px solid #FFF4DD; border-radius: 16px; display: flex; align-items: center; gap: 8px; padding: 0 18px 0 14px; color: #ECEDF0; text-decoration: none; font-weight: 600; font-size: 14px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-5L16 4l4 4L9 19z"></path><path d="M14 6l4 4"></path></svg>
      Muokkaa
    </a>
    <div style="flex: 1; text-align: center; font-weight: 600; font-size: 17px; line-height: 1">Kapteenin kartta</div>
    <a href="Main.dc.html" aria-label="Sulje" style="width: 52px; height: 52px; box-sizing: border-box; border: 3px solid #FFF4DD; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #FFF4DD">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
  </header>

  <div style="width: 1194px; height: 672px; flex: none; position: relative; overflow: hidden; background: #BFE6FF">
    <img src="img/harbor.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block">
    <img src="img/boy.png" alt="" style="position: absolute; left: 14%; bottom: 6%; height: 44%">
    <img src="img/captain.png" alt="" style="position: absolute; left: 42%; bottom: 8%; height: 46%">
    <img src="img/quartermaster.png" alt="" style="position: absolute; left: 56%; bottom: 8%; height: 50%">
    <div style="position: absolute; left: 56%; top: 27%; width: 260px; box-sizing: border-box; padding: 16px 22px; background: #FFFFFF; border: 4px solid #23262F; border-radius: 50%; font-family: 'Indie Flower', 'Comic Sans MS', cursive; font-size: 30px; line-height: 1.1; text-align: center; color: #23262F">
      Kartta on meillä.
      <svg width="34" height="28" viewBox="0 0 34 28" aria-hidden="true" style="position: absolute; left: 34px; bottom: -25px; display: block; transform: scaleX(-1)"><path d="M2 0 L30 26 L22 0" fill="#FFFFFF" stroke="#23262F" stroke-width="4" stroke-linejoin="round"></path><path d="M1 0 h24" stroke="#FFFFFF" stroke-width="5"></path></svg>
    </div>
  </div>

  <div style="flex: 1; box-sizing: border-box; display: flex; align-items: center; gap: 20px; padding: 0 24px">
    <button onClick="{{ toggle }}" aria-label="{{ playLabel }}" style="width: 60px; height: 60px; flex: none; box-sizing: border-box; border: 3px solid #23262F; border-radius: 50%; background: #F2B544; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
      <sc-if value="{{ playing }}" hint-placeholder-val="{{ true }}">
        <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="#23262F"></rect><rect x="14" y="4" width="5" height="16" rx="1.5" fill="#23262F"></rect></svg>
      </sc-if>
      <sc-if value="{{ paused }}" hint-placeholder-val="{{ false }}">
        <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="#23262F"></path></svg>
      </sc-if>
    </button>
    <div style="flex: 1; height: 16px; position: relative; border-radius: 8px; background: #3A3E4B">
      <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 58%; border-radius: 8px; background: #F2B544"></div>
      <div style="position: absolute; left: 58%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; box-sizing: border-box; border-radius: 50%; background: #FFF4DD; border: 3px solid #23262F"></div>
    </div>
    <div style="font-weight: 500; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap">0:24 / 0:41</div>
    <button aria-label="Koko näyttö" style="width: 48px; height: 48px; box-sizing: border-box; border: 3px solid #FFF4DD; border-radius: 14px; background: transparent; display: flex; align-items: center; justify-content: center; color: #FFF4DD; cursor: pointer; padding: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playing: true };
  }
  renderVals() {
    const p = this.state.playing;
    return {
      playing: p,
      paused: !p,
      playLabel: p ? 'Tauko' : 'Toista',
      toggle: () => this.setState({ playing: !p }),
    };
  }
}
</script>
</body>
</html>
