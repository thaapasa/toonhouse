name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # The server tests make their own database on this server.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: toonhouse
          POSTGRES_PASSWORD: toonhouse
          POSTGRES_DB: toonhouse
        ports:
          - 10732:5432
        options: >-
          --health-cmd "pg_isready -U toonhouse -d toonhouse" --health-interval
          5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name:
          Check that the Dockerfile uses the Node.js and pnpm versions from
          mise.toml
        run: |
          for tool in node pnpm; do
            MISE_VERSION=$(mise current "$tool")
            ARG=$(echo "$tool" | tr a-z A-Z)_VERSION
            DOCKER_VERSION=$(sed -n "s/^ARG $ARG=//p" Dockerfile)
            if [ "$MISE_VERSION" != "$DOCKER_VERSION" ]; then
              echo "::error::Dockerfile has $tool $DOCKER_VERSION, mise.toml has $MISE_VERSION"
              exit 1
            fi
          done
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
