# Local development tasks for dekit. `mise start` runs it, see README.md.
tasks:
  dev/:
  dev/server:
    cmd: pnpm server
    deps: [db/postgres]
    ready: { tcp: 10700 }
    autostart: true
  dev/web:
    cmd: pnpm web
    ready: { tcp: 10710 }
    autostart: true
  dev/studio:
    cmd: pnpm studio
    ready: { tcp: 10711 }
    autostart: true
  dev/prototypes:
    cmd: pnpm prototypes
    ready: { tcp: 10790 }
    autostart: false

  check/:
  check/lint:
    type: job
    cmd: pnpm lint --fix
  check/format:
    type: job
    cmd: pnpm format
  check/typecheck:
    type: job
    cmd: pnpm typecheck
  check/test:
    type: job
    cmd: pnpm test
    deps: [db/postgres]
  check/test-watch:
    cmd: pnpm test:watch

  db/:
  db/postgres:
    type: job
    cmd: docker compose up --detach --wait db
  db/set-user:
    type: job
    cmd: pnpm set-user --prompt
    deps: [db/postgres]
  db/migrate:
    type: job
    cmd: pnpm migrate
    deps: [db/postgres]

  build:
    type: job
    cmd: pnpm build
