# Local development database. Start with `docker compose up -d`.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: toonhouse
      POSTGRES_PASSWORD: toonhouse
      POSTGRES_DB: toonhouse
    ports:
      - '${DB_PORT:-10732}:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U toonhouse -d toonhouse']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
